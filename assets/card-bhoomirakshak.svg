<svg xmlns="http://www.w3.org/2000/svg" width="410" height="273" viewBox="0 0 410 273">
<style>
  text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .a { opacity: 0; animation: in .6s ease-out forwards; }
  @keyframes in { from { opacity: 0; transform: translateY(8px); }
                  to   { opacity: 1; transform: translateY(0); } }
</style>
<rect x=".5" y=".5" width="409" height="272" rx="10" fill="#0d1117" stroke="#30363d"/>
<g class="a" style="animation-delay:0.25s">
<circle cx="22" cy="20" r="5" fill="#ff5f56"/><circle cx="40" cy="20" r="5" fill="#ffbd2e"/><circle cx="58" cy="20" r="5" fill="#27c93f"/>
<text x="76" y="24" font-size="11" fill="#8b949e">~/projects/bhoomirakshak</text>
<text x="22" y="62" font-size="16" font-weight="700" fill="#58a6ff">BhoomiRakshak</text>
<text x="22" y="82" font-size="12" fill="#8b949e">PKI-based land record system (MVP)</text>
<text x="22" y="112" font-size="12" fill="#c9d1d9">Every registration or transfer is digitally</text><text x="22" y="131" font-size="12" fill="#c9d1d9">signed (RSA-2048) and routed Landowner →</text><text x="22" y="150" font-size="12" fill="#c9d1d9">Village Officer → Registrar. Chained</text><text x="22" y="169" font-size="12" fill="#c9d1d9">signatures give a tamper-evident audit trail.</text>
<rect x="22.0" y="182" width="65.6" height="22" rx="11" fill="#161b22" stroke="#58a6ff" stroke-opacity=".55"/><text x="54.8" y="196.8" text-anchor="middle" font-size="11" fill="#58a6ff">Node.js</text><rect x="95.6" y="182" width="65.6" height="22" rx="11" fill="#161b22" stroke="#58a6ff" stroke-opacity=".55"/><text x="128.4" y="196.8" text-anchor="middle" font-size="11" fill="#58a6ff">Express</text><rect x="169.2" y="182" width="86.0" height="22" rx="11" fill="#161b22" stroke="#58a6ff" stroke-opacity=".55"/><text x="212.2" y="196.8" text-anchor="middle" font-size="11" fill="#58a6ff">TypeScript</text><rect x="263.2" y="182" width="58.8" height="22" rx="11" fill="#161b22" stroke="#58a6ff" stroke-opacity=".55"/><text x="292.6" y="196.8" text-anchor="middle" font-size="11" fill="#58a6ff">Prisma</text><rect x="22.0" y="212" width="86.0" height="22" rx="11" fill="#161b22" stroke="#58a6ff" stroke-opacity=".55"/><text x="65.0" y="226.8" text-anchor="middle" font-size="11" fill="#58a6ff">PostgreSQL</text><rect x="116.0" y="212" width="52.0" height="22" rx="11" fill="#161b22" stroke="#58a6ff" stroke-opacity=".55"/><text x="142.0" y="226.8" text-anchor="middle" font-size="11" fill="#58a6ff">React</text><rect x="176.0" y="212" width="72.4" height="22" rx="11" fill="#161b22" stroke="#58a6ff" stroke-opacity=".55"/><text x="212.2" y="226.8" text-anchor="middle" font-size="11" fill="#58a6ff">Tailwind</text>
